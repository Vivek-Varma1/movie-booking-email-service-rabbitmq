server:
  port: 8081
spring:
  application:
    name: email-notification-service

  Kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
  mail:

    host: smtp.gmail.com

    port: 587

    username: ${MAIL_USERNAME}

    password: ${MAIL_PASSWORD}

    properties:

      mail.smtp.auth: true

      mail.smtp.starttls.enable: true
server:
  port: 8081
spring:
  application:
    name: email-notification-service

  rabbitmq:
    addresses: ${RABBITMQ_URL}

  mail:

    host: smtp.gmail.com

    port: 587

    username: ${MAIL_USERNAME}

    password: ${MAIL_PASSWORD}

    properties:

      mail.smtp.auth: true

      mail.smtp.starttls.enable: true
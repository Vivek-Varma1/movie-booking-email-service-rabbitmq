<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            padding:40px;
        }

        .container{

            max-width:650px;

            background:white;

            margin:auto;

            border-radius:12px;

            overflow:hidden;

            box-shadow:0 2px 10px rgba(0,0,0,.15);

        }

        .header{

            background:#1f2937;

            color:white;

            text-align:center;

            padding:20px;

        }

        .content{

            padding:30px;

        }

        table{

            width:100%;

            border-collapse:collapse;

        }

        td{

            padding:12px;

            border-bottom:1px solid #eee;

        }

        .footer{

            text-align:center;

            padding:20px;

            color:gray;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🎬 Booking Confirmed</h1>

    </div>

    <div class="content">

        <p>

            Hello <b th:text="${userName}"></b>,

        </p>

        <p>

            Your booking has been confirmed successfully.

        </p>

        <table>

            <tr>

                <td><b>Booking ID</b></td>

                <td th:text="${bookingId}"></td>

            </tr>

            <tr>

                <td><b>Ticket Number</b></td>

                <td th:text="${ticketNumber}"></td>

            </tr>

            <tr>

                <td><b>Movie</b></td>

                <td th:text="${movieName}"></td>

            </tr>

            <tr>

                <td><b>Theatre</b></td>

                <td th:text="${theatreName}"></td>

            </tr>

            <tr>

                <td><b>Screen</b></td>

                <td th:text="${screenName}"></td>

            </tr>

            <tr>

                <td><b>Show Time</b></td>

                <td th:text="${showTime}"></td>

            </tr>

            <tr>

                <td><b>Seats</b></td>

                <td th:text="${seats}"></td>

            </tr>

        </table>

    </div>

    <div class="footer">

        Enjoy your movie 🍿

    </div>

</div>

</body>

</html>
